name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install build dependencies
        # --legacy-peer-deps：规避 npm Arborist "Cannot read properties of null
        # (reading 'edgesOut')" 崩溃（--no-save + peerDeps 自动安装时触发）
        run: npm install --no-save --legacy-peer-deps typescript tsdown @types/node

      - name: Build host (tsc)
        run: bash scripts/build.sh

      - name: Build client (tsdown)
        run: npx tsdown

      - name: Check NPM_TOKEN
        id: check_npm
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "has_token=${{ env.TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.check_npm.outputs.has_token == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

      - name: Pack release asset
        run: npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
          generate_release_notes: true
